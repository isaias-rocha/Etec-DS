<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/conulta.css">
    <title>Consulta de Dados</title>
</head>

<body>
    <div class="container">
        <h2>Buscar Cadastro</h2>

        <form id="consultaForm" action="consulta.php" method="post">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="seuemail@dominio.com">
            </div>
            <button id="btnConsultar">Consultar Dados</button>
        </form>

        <!-- Tabela com dados da consulta-->
        <div id="tabelaResultado">
            <table class="table table-bordered table-hover table-sm mt-2">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Criado em</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="col-id"></td>
                        <td id="col-criado_em"></td>
                        <td id="col-nome"></td>
                        <td id="col-email"></td>
                        <td id="col-telefone"></td>
                        <td id="col-endereco"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
