<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/formulario.css">
    <link rel="script" href="/js/cadastro-feedback.js">
    <title>Cadastro</title>
</head>

<body>
    <div class="contorno">
        <h1>Criar conta</h1>
        <p>Preencha os dados abaixo para se cadastrar no sistema.</p>

        <form id="formCadastroLogin" action="/php/process/process.php" method="post">
            <label for="nomeDigitado">Nome Completo</label>
            <input type="text" name="nome" id="nomeDigitado" placeholder="Nome Completo">

            <label for="emailDigitado">E-mail</label>
            <input type="email" name="email" id="emailDigitado" placeholder="exemplo@gmail.com">

            <label for="senhaDigitada">Senha</label>
            <input type="password" name="senha" id="senhaDigitada" placeholder="Mínimo 6 caracteres">
            <p class="hint">A senha deve ter pelo menos 8 caracteres.
            </p>

            <input type="password" name="confirmar" id="confirmarSenha" placeholder="Repita a senha">

            <button type="submit" id="btnCadastrar">cadastrar</button>
        </form>

        <div id="feedbackCadastro" class="feedback"></div>
        <p class="link-nav">Já tem uma conta? <a href="/html/login/login.html">Entrar</a></p>

</body>
</html>
